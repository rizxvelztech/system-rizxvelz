<!DOCTYPE html>
<html lang="id" x-data="app()" :class="{'dark':dark}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Syonx - User Management</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { 'display': ['Poppins', 'sans-serif'], 'body': ['Inter', 'sans-serif'] },
          colors: { 'primary': '#3b82f6', 'primary-dark': '#2563eb' }
        }
      }
    }
  </script>
  
  <style>
    *,*::before,*::after{box-sizing:border-box}
    body{font-family:'Inter',sans-serif}
    ::-webkit-scrollbar{width:5px}
    ::-webkit-scrollbar-thumb{background:#3b82f6;border-radius:99px}
    .toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:12px;background:#3b82f6;color:white;z-index:1000;transform:translateX(400px);transition:transform .3s}
    .toast.show{transform:translateX(0)}
    .toast.error{background:#ef4444}
    [x-cloak]{display:none!important}
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100">

<header class="fixed top-0 inset-x-0 z-50 bg-white/90 dark:bg-gray-950/90 backdrop-blur-md shadow-sm">
  <nav class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
    <a href="execution.html" class="font-display font-bold text-xl">Syonx<span class="text-primary">Light</span></a>
    <button @click="dark=!dark" class="w-9 h-9 flex items-center justify-center rounded-full border border-gray-200 dark:border-gray-800">
      <svg x-show="!dark" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
      <svg x-show="dark" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707-.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"/></svg>
    </button>
  </nav>
</header>

<main class="pt-24 pb-12 max-w-6xl mx-auto px-6">
  <div class="flex justify-between items-center mb-8 flex-wrap gap-4">
    <h1 class="font-display font-bold text-3xl">👥 User Management</h1>
    <button @click="showAddForm=!showAddForm" class="px-5 py-2.5 bg-primary text-white rounded-xl hover:bg-primary-dark transition">+ Add User</button>
  </div>
  
  <!-- Add User Form -->
  <div x-show="showAddForm" x-cloak class="bg-white dark:bg-gray-900 rounded-2xl p-6 mb-8 border border-gray-200 dark:border-gray-800">
    <h3 class="font-semibold text-lg mb-4">Add New User</h3>
    <div class="grid md:grid-cols-4 gap-4">
      <input type="text" x-model="newUsername" placeholder="Username" class="px-4 py-2 rounded-xl bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700">
      <input type="text" x-model="newPassword" placeholder="Password" class="px-4 py-2 rounded-xl bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700">
      <input type="number" x-model="newDurasi" placeholder="Days" class="px-4 py-2 rounded-xl bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700">
      <select x-model="newRole" class="px-4 py-2 rounded-xl bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700">
        <option value="user">User</option>
        <option value="reseller" x-show="canCreateReseller">Reseller</option>
        <option value="admin" x-show="canCreateAdmin">Admin</option>
      </select>
    </div>
    <div class="mt-4 flex gap-3">
      <button @click="addUser" class="px-5 py-2 bg-primary text-white rounded-xl">Create</button>
      <button @click="showAddForm=false" class="px-5 py-2 border border-gray-300 dark:border-gray-700 rounded-xl">Cancel</button>
    </div>
  </div>
  
  <!-- User Table -->
  <div class="bg-white dark:bg-gray-900 rounded-2xl border border-gray-200 dark:border-gray-800 overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full">
        <thead class="bg-gray-50 dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700">
          <tr>
            <th class="px-6 py-4 text-left text-sm font-semibold">Username</th>
            <th class="px-6 py-4 text-left text-sm font-semibold">Role</th>
            <th class="px-6 py-4 text-left text-sm font-semibold">Expired</th>
            <th class="px-6 py-4 text-left text-sm font-semibold">Actions</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="user in filteredUsers" :key="user.username">
            <tr class="border-b border-gray-100 dark:border-gray-800">
              <td class="px-6 py-4" x-text="user.username"></td>
              <td class="px-6 py-4"><span class="px-2 py-1 rounded-full text-xs" :class="user.role==='owner'?'bg-purple-100 text-purple-700':user.role==='admin'?'bg-blue-100 text-blue-700':user.role==='reseller'?'bg-orange-100 text-orange-700':'bg-gray-100 text-gray-700'" x-text="user.role"></span></td>
              <td class="px-6 py-4 text-sm" x-text="formatDate(user.expired)"></td>
              <td class="px-6 py-4">
                <button @click="editUser(user.username)" class="text-primary hover:text-primary-dark text-sm mr-3">Edit</button>
                <button @click="deleteUser(user.username)" class="text-red-500 hover:text-red-600 text-sm" x-show="!isProtected(user)">Delete</button>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </div>
  
  <div class="mt-8">
    <a href="execution.html" class="inline-block px-5 py-2.5 border border-gray-300 dark:border-gray-700 rounded-xl hover:border-primary transition">← Back to Dashboard</a>
  </div>
</main>

<div id="toast" class="toast"><span id="toastMsg"></span></div>

<script>
function app() {
  return {
    dark: false,
    showAddForm: false,
    newUsername: '',
    newPassword: '',
    newDurasi: 30,
    newRole: 'user',
    
    currentUser: null,
    users: [],
    
    init() {
      this.dark = localStorage.getItem('theme') === 'dark';
      this.$watch('dark', v => localStorage.setItem('theme', v ? 'dark' : 'light'));
      
      if (localStorage.getItem('isLoggedIn') !== 'true') {
        window.location.href = 'login.html';
        return;
      }
      
      this.currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
      this.loadUsers();
    },
    
    loadUsers() {
      this.users = JSON.parse(localStorage.getItem('users') || '[]');
    },
    
    saveUsers() {
      localStorage.setItem('users', JSON.stringify(this.users));
    },
    
    get currentUserRole() {
      return this.currentUser.role;
    },
    
    get canCreateReseller() {
      return this.currentUserRole === 'owner' || this.currentUserRole === 'admin';
    },
    
    get canCreateAdmin() {
      return this.currentUserRole === 'owner';
    },
    
    get filteredUsers() {
      let filtered = this.users;
      if (this.currentUserRole === 'reseller') {
        filtered = filtered.filter(u => u.role === 'user');
      } else if (this.currentUserRole === 'admin') {
        filtered = filtered.filter(u => u.role !== 'owner');
      }
      return filtered;
    },
    
    isProtected(user) {
      if (user.username === this.currentUser.username) return true;
      if (this.currentUserRole === 'reseller' && user.role !== 'user') return true;
      if (this.currentUserRole === 'admin' && (user.role === 'admin' || user.role === 'owner')) return true;
      if (this.currentUserRole !== 'owner' && user.role === 'owner') return true;
      return false;
    },
    
    formatDate(timestamp) {
      return new Date(timestamp).toLocaleDateString('id-ID');
    },
    
    showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.textContent = msg;
      toast.className = 'toast ' + (isError ? 'error' : '');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    },
    
    addUser() {
      if (!this.newUsername || !this.newPassword) {
        this.showToast('Fill username & password!', true);
        return;
      }
      
      if (this.users.find(u => u.username === this.newUsername)) {
        this.showToast('Username exists!', true);
        return;
      }
      
      const expired = Date.now() + (this.newDurasi * 86400000);
      this.users.push({
        username: this.newUsername,
        password: this.newPassword,
        role: this.newRole,
        expired: expired,
        isLoggedIn: false
      });
      
      this.saveUsers();
      this.showToast('User added successfully!');
      this.newUsername = '';
      this.newPassword = '';
      this.newDurasi = 30;
      this.newRole = 'user';
      this.showAddForm = false;
    },
    
    editUser(username) {
      window.location.href = `edituser.html?username=${encodeURIComponent(username)}`;
    },
    
    deleteUser(username) {
      if (!confirm(`Delete user "${username}"?`)) return;
      
      this.users = this.users.filter(u => u.username !== username);
      this.saveUsers();
      this.showToast('User deleted!');
    }
  }
}
</script>
</body>
</html>
