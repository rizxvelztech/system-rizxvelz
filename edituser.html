<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Edit User - Zero</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: #000;
      color: #a5b4fc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      position: relative;
    }
    #particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
    
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #1a1a2e; }
    ::-webkit-scrollbar-thumb { background: #6366f1; border-radius: 99px; }
    
    .container {
      position: relative; z-index: 2; background: rgba(0,0,0,0.7);
      border: 1px solid #6366f1; border-radius: 20px; padding: 30px;
      max-width: 500px; width: 100%; backdrop-filter: blur(10px);
    }
    h2 { text-align: center; color: #c7d2fe; margin-bottom: 20px; }
    input, select {
      width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px;
      border: 1px solid #6366f1; background: #1a001a; color: white;
      font-family: 'Poppins', sans-serif;
    }
    button {
      width: 100%; padding: 12px; background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px;
      font-family: 'Poppins', sans-serif; font-weight: bold;
    }
    button:hover { transform: translateY(-2px); }
    .back-btn { display: block; text-align: center; margin-top: 15px; color: #a5b4fc; text-decoration: none; }
    .back-btn:hover { color: #c7d2fe; }
  </style>
</head>
<body>
  <div id="particles"></div>
  <div class="container">
    <h2><i class="fas fa-edit"></i> Edit User</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="text" id="password" placeholder="Password">
    <input type="number" id="extend" placeholder="Extend (days)" value="0">
    <select id="role"></select>
    <button onclick="saveEdit()">Save Changes</button>
    <a href="userlist.html" class="back-btn">← Back to User List</a>
  </div>

  <script src="https://cdn.jsdelivr.net/gh/jnicol/particleground/jquery.particleground.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const oldUsername = urlParams.get('username');
    
    function getUsers() { return JSON.parse(localStorage.getItem("users") || "[]"); }
    function saveUsers(users) { localStorage.setItem("users", JSON.stringify(users)); }
    
    const currentUserRole = JSON.parse(localStorage.getItem("currentUser") || "{}").role;
    const users = getUsers();
    const targetUser = users.find(u => u.username === oldUsername);
    
    if (!targetUser) window.location.href = "userlist.html";
    
    document.getElementById("username").value = targetUser.username;
    document.getElementById("password").value = targetUser.password;
    
    const roleSelect = document.getElementById("role");
    roleSelect.innerHTML = "";
    
    let roles = [];
    if (currentUserRole === "owner") roles = ["user", "reseller", "admin", "owner"];
    else if (currentUserRole === "admin") roles = ["user", "reseller"];
    else if (currentUserRole === "reseller") roles = ["user"];
    
    roles.forEach(role => {
      const opt = document.createElement("option");
      opt.value = role;
      opt.textContent = role.charAt(0).toUpperCase() + role.slice(1);
      if (targetUser.role === role) opt.selected = true;
      roleSelect.appendChild(opt);
    });
    
    function saveEdit() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const extend = parseInt(document.getElementById("extend").value) || 0;
      const newRole = document.getElementById("role").value;
      
      const index = users.findIndex(u => u.username === oldUsername);
      if (index !== -1) {
        users[index].username = username;
        users[index].password = password;
        if (extend > 0) {
          const now = Date.now();
          const currentExp = users[index].expired > now ? users[index].expired : now;
          users[index].expired = currentExp + (extend * 86400000);
        }
        if (currentUserRole === "owner") users[index].role = newRole;
        else if (currentUserRole === "admin" && (newRole === "user" || newRole === "reseller")) users[index].role = newRole;
        
        saveUsers(users);
        alert("User updated!");
        window.location.href = "userlist.html";
      }
    }
    
    document.addEventListener('DOMContentLoaded', () => {
      particleground(document.getElementById('particles'), {
        dotColor: '#a5b4fc', lineColor: '#6366f1',
        minSpeedX: 0.1, maxSpeedX: 0.3, minSpeedY: 0.1, maxSpeedY: 0.3,
        density: 10000, particleRadius: 3,
      });
    });
  </script>
</body>
</html>
