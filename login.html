<!DOCTYPE html>
<html lang="id" x-data="app()" :class="{'dark':dark}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Syonx - Login</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { 'display': ['Poppins', 'sans-serif'], 'body': ['Inter', 'sans-serif'] },
          colors: { 'primary': '#8b5cf6', 'primary-dark': '#7c3aed' }
        }
      }
    }
  </script>
  
  <style>
    *,*::before,*::after{box-sizing:border-box}
    body{font-family:'Inter',sans-serif;transition:background-color .3s,color .3s}
    ::-webkit-scrollbar{width:5px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:#8b5cf6;border-radius:99px}
    .toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:12px;background:#8b5cf6;color:white;z-index:1000;transform:translateX(400px);transition:transform .3s}
    .toast.show{transform:translateX(0)}
    .toast.error{background:#ef4444}
    [x-cloak]{display:none!important}
  </style>
</head>
<body class="bg-black text-purple-200 min-h-screen flex items-center justify-center">

<div class="absolute top-1/4 left-0 w-96 h-96 bg-purple-600/10 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute bottom-0 right-0 w-96 h-96 bg-purple-600/5 rounded-full blur-3xl pointer-events-none"></div>

<div class="relative z-10 w-full max-w-md mx-auto px-6">
  <!-- Logo & Title -->
  <div class="text-center mb-8">
    <img src="https://files.catbox.moe/sipqb2.png" alt="Logo" class="w-20 h-20 mx-auto mb-4 filter drop-shadow-lg">
    <h1 class="font-display font-bold text-3xl text-white">SYONX - LIGHT</h1>
    <p class="text-purple-300 text-sm mt-2">Gateway to System Endpoint API Bug</p>
  </div>
  
  <!-- Login Card -->
  <div class="bg-purple-950/30 backdrop-blur-md rounded-2xl border border-purple-700/50 p-8 shadow-2xl shadow-purple-600/20">
    <form id="loginForm" @submit.prevent="login">
      <div class="mb-5">
        <div class="relative">
          <svg class="absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          <input type="text" id="username" class="w-full px-4 py-3 pl-12 rounded-xl bg-purple-900/30 border border-purple-700 text-purple-200 placeholder-purple-500 focus:border-purple-500 focus:outline-none transition" placeholder="Username">
        </div>
      </div>
      
      <div class="mb-6">
        <div class="relative">
          <svg class="absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
          <input type="password" id="password" class="w-full px-4 py-3 pl-12 rounded-xl bg-purple-900/30 border border-purple-700 text-purple-200 placeholder-purple-500 focus:border-purple-500 focus:outline-none transition" placeholder="Password">
        </div>
      </div>
      
      <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-medium py-3 rounded-xl transition-all shadow-lg shadow-purple-600/30 transform hover:-translate-y-0.5">
        LOGIN NOW
      </button>
    </form>
    
    <div class="mt-6 text-center">
      <a href="index.html" class="text-sm text-purple-400 hover:text-purple-300 transition">← VIEW PLANS & PRICING</a>
    </div>
  </div>
  
  <p class="text-center text-xs text-purple-500 mt-8">© 2024 RizxvelzExerc1st. All rights reserved.</p>
</div>

<div id="toast" class="toast"><span id="toastMsg"></span></div>

<script>
function app() {
  return {
    dark: false,
    
    init() {
      this.dark = localStorage.getItem('theme') === 'dark' ||
        (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
      this.$watch('dark', v => localStorage.setItem('theme', v ? 'dark' : 'light'));
      
      if (localStorage.getItem('isLoggedIn') === 'true') {
        window.location.href = 'execution.html';
      }
    },
    
    login() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      
      let users = JSON.parse(localStorage.getItem('users') || '[]');
      if (users.length === 0) {
        users = [
          { username: 'admin', password: 'admin123', role: 'owner', expired: Date.now() + 365*86400000, isLoggedIn: false },
          { username: 'demo', password: 'demo123', role: 'user', expired: Date.now() + 30*86400000, isLoggedIn: false }
        ];
        localStorage.setItem('users', JSON.stringify(users));
      }
      
      const user = users.find(u => u.username === username && u.password === password);
      
      if (!user) {
        this.showToast('Login gagal atau expired', true);
        return;
      }
      
      if (user.expired && Date.now() > user.expired) {
        this.showToast('Login gagal atau expired', true);
        return;
      }
      
      if (user.isLoggedIn && user.role !== 'owner') {
        this.showToast('User sudah login di device lain', true);
        return;
      }
      
      user.isLoggedIn = true;
      localStorage.setItem('users', JSON.stringify(users));
      localStorage.setItem('currentUser', JSON.stringify({
        username: user.username, role: user.role, expired: user.expired
      }));
      localStorage.setItem('isLoggedIn', 'true');
      
      this.showToast('Login berhasil! Mengarahkan...');
      setTimeout(() => window.location.href = 'execution.html', 1000);
    },
    
    showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.textContent = msg;
      toast.className = 'toast ' + (isError ? 'error' : '');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }
  }
}
</script>
</body>
</html>
