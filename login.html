<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login - Zero</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="icon" href="https://files.catbox.moe/sipqb2.png" type="image/png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: black;
      font-family: 'Poppins', sans-serif;
      color: #a5b4fc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #1a1a2e;
    }
    ::-webkit-scrollbar-thumb {
      background: #6366f1;
      border-radius: 99px;
    }

    #particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .login-container {
      position: relative;
      z-index: 2;
      background: rgba(99, 102, 241, 0.05);
      border: 1px solid rgba(99, 102, 241, 0.2);
      backdrop-filter: blur(8px);
      padding: 40px 30px;
      border-radius: 20px;
      max-width: 450px;
      width: 90%;
      box-shadow: 0 0 25px rgba(99, 102, 241, 0.3);
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo-container {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo {
      width: 80px;
      filter: drop-shadow(0 0 10px #6366f1);
      margin-bottom: 15px;
    }

    .title {
      font-size: 32px;
      color: #c7d2fe;
      text-shadow: 0 0 10px #6366f1;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: #a5b4fc;
      margin-bottom: 30px;
    }

    .form-group {
      position: relative;
      margin-bottom: 20px;
    }

    .form-group i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #6366f1;
      font-size: 16px;
    }

    .form-control {
      width: 100%;
      padding: 14px 14px 14px 45px;
      border-radius: 10px;
      border: none;
      background: rgba(99, 102, 241, 0.1);
      color: white;
      font-size: 14px;
      font-family: 'Poppins', sans-serif;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    .form-control:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 10px rgba(99, 102, 241, 0.3);
    }

    .form-control::placeholder {
      color: #a5b4fc;
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Poppins', sans-serif;
      margin-top: 10px;
    }

    .btn-login:hover {
      background: #818cf8;
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(99, 102, 241, 0.4);
    }

    .btn-access {
      display: inline-block;
      width: 100%;
      text-align: center;
      background: rgba(99, 102, 241, 0.2);
      color: #c7d2fe;
      padding: 12px;
      border-radius: 10px;
      font-weight: 500;
      text-decoration: none;
      margin-top: 15px;
      transition: all 0.3s ease;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    .btn-access:hover {
      background: rgba(99, 102, 241, 0.3);
      transform: translateY(-2px);
    }

    .footer {
      margin-top: 30px;
      text-align: center;
      font-size: 12px;
      color: #6366f1;
    }

    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 12px 20px;
      border-radius: 8px;
      background: rgba(70, 0, 120, 0.9);
      border: 1px solid #6366f1;
      color: white;
      z-index: 1000;
      transform: translateX(100vw);
      transition: transform 0.3s ease;
    }
    
    .toast.show {
      transform: translateX(0);
    }
    
    .toast.error {
      background: rgba(220, 38, 38, 0.9);
      border-color: #ef4444;
    }

    @media (max-width: 480px) {
      .login-container { padding: 30px 20px; width: 95%; }
      .title { font-size: 28px; }
      .subtitle { font-size: 13px; }
      .form-control { padding: 12px 12px 12px 40px; }
      .btn-login, .btn-access { padding: 12px; }
    }

    html, body {
      touch-action: manipulation;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
  </style>
</head>

<body>
  <div id="particles"></div>
  
  <div class="login-container">
    <div class="logo-container">
      <img src="https://files.catbox.moe/sipqb2.png" alt="Logo" class="logo">
      <div class="title">ZERO - LIGHT</div>
      <div class="subtitle">Gateway to System Endpoint API Bug</div>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <i class="fas fa-user"></i>
        <input type="text" id="username" class="form-control" placeholder="Username" required />
      </div>
      <div class="form-group">
        <i class="fas fa-key"></i>
        <input type="password" id="password" class="form-control" placeholder="Password" required />
      </div>
      <button type="submit" class="btn-login">
        <i class="fas fa-lock"></i> LOGIN NOW
      </button>
    </form>

    <a class="btn-access" href="index.html">
      <i class="fas fa-crown"></i> VIEW PLANS & PRICING
    </a>

    <div class="footer">© 2024 Afrizal. All rights reserved.</div>
  </div>

  <div id="toast" class="toast">
    <i class="fas fa-exclamation-circle"></i> <span id="toastText"></span>
  </div>
  
  <script>
    // Default users data
    const DEFAULT_USERS = [
      { username: "admin", password: "admin123", role: "owner", expired: Date.now() + 365 * 86400000, isLoggedIn: false },
      { username: "demo", password: "demo123", role: "user", expired: Date.now() + 30 * 86400000, isLoggedIn: false }
    ];

    function initDatabase() {
      if (!localStorage.getItem("users")) {
        localStorage.setItem("users", JSON.stringify(DEFAULT_USERS));
      }
    }

    function showToast(message, isError = false) {
      const toast = document.getElementById("toast");
      const toastText = document.getElementById("toastText");
      toastText.textContent = message;
      toast.className = "toast " + (isError ? "error" : "");
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 3000);
    }

    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();
      
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      
      initDatabase();
      const users = JSON.parse(localStorage.getItem("users"));
      const user = users.find(u => u.username === username && u.password === password);
      
      if (!user) {
        showToast("Username atau password salah!", true);
        return;
      }
      
      if (user.expired && Date.now() > user.expired) {
        showToast("Akun sudah kedaluwarsa!", true);
        return;
      }
      
      if (user.isLoggedIn && user.role !== "owner") {
        showToast("User sedang login di device lain!", true);
        return;
      }
      
      // Set login status
      user.isLoggedIn = true;
      localStorage.setItem("users", JSON.stringify(users));
      localStorage.setItem("currentUser", JSON.stringify({
        username: user.username,
        role: user.role,
        expired: user.expired
      }));
      localStorage.setItem("isLoggedIn", "true");
      
      showToast("Login berhasil! Mengarahkan...");
      setTimeout(() => {
        window.location.href = "execution.html";
      }, 1500);
    });
    
    // Check if already logged in
    if (localStorage.getItem("isLoggedIn") === "true") {
      window.location.href = "execution.html";
    }
  </script>
  
  <script src="https://cdn.jsdelivr.net/gh/jnicol/particleground/jquery.particleground.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      particleground(document.getElementById('particles'), {
        dotColor: '#a5b4fc',
        lineColor: '#6366f1',
        minSpeedX: 0.1,
        maxSpeedX: 0.3,
        minSpeedY: 0.1,
        maxSpeedY: 0.3,
        density: 10000,
        particleRadius: 3,
      });
    }, false);
  </script>
</body>
</html>
