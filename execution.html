<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zero - Execution Panel</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', sans-serif;
      background: #000;
      color: #a5b4fc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }
    #particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
    
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #6366f1; border-radius: 99px; }
    
    .card {
      position: relative; z-index: 2; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px);
      padding: 45px; border-radius: 24px; border: 1px solid #6366f1;
      box-shadow: 0 0 30px rgba(99,102,241,0.4); width: 95%; max-width: 700px;
      text-align: center; animation: fade .8s ease;
    }
    @keyframes fade { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    
    .logo {
      width: 260px;
      max-width: 100%;
      height: auto;
      filter: drop-shadow(0 0 10px #6366f1);
      margin-bottom: 20px;
      border-radius: 16px;
      object-fit: cover;
    }
    .username { font-size: 26px; color: #c7d2fe; font-weight: bold; margin-bottom: 8px; }
    .connected {
      font-size: 16px; color: #6366f1; margin-bottom: 20px; display: flex;
      justify-content: center; align-items: center; text-transform: uppercase;
    }
    .connected::before {
      content: ''; width: 10px; height: 10px; background: #22c55e;
      border-radius: 50%; display: inline-block; margin-right: 8px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.3); opacity: 0.6; } 100% { transform: scale(1); opacity: 1; } }
    
    input[type="text"] {
      width: 100%; padding: 16px; border-radius: 12px; background: #1a001a;
      border: 1px solid #6366f1; color: #a5b4fc; margin-bottom: 20px;
      font-family: 'Poppins', sans-serif; font-size: 15px;
    }
    input:focus { outline: none; border-color: #818cf8; box-shadow: 0 0 10px rgba(99,102,241,0.3); }
    
    .dropdown { position: relative; width: 100%; margin-top: 12px; }
    .dropdown-toggle {
      width: 100%; background: linear-gradient(145deg, #1a001a, #2a004a);
      border: 2px solid #6366f1; border-radius: 12px; padding: 16px 20px;
      font-size: 16px; font-weight: 600; color: #a5b4fc; text-align: left;
      cursor: pointer; display: flex; justify-content: space-between; transition: 0.3s;
    }
    .dropdown-toggle:hover { background: linear-gradient(145deg, #2a004a, #3a006a); box-shadow: 0 0 20px rgba(99,102,241,0.4); }
    .dropdown-toggle i { transition: transform 0.3s; }
    .dropdown.open .dropdown-toggle i { transform: rotate(180deg); }
    .dropdown-menu {
      position: absolute; top: calc(100% + 6px); left: 0; right: 0;
      background: rgba(26,0,26,0.95); border: 2px solid #6366f1; border-radius: 12px;
      display: none; flex-direction: column; z-index: 999; overflow: hidden;
    }
    .dropdown.open .dropdown-menu { display: flex; }
    .dropdown-item {
      padding: 14px 18px; font-size: 15px; font-weight: 500; color: #a5b4fc;
      cursor: pointer; transition: 0.25s;
    }
    .dropdown-item:hover { background: #2a004a; color: #fff; }
    
    .execute-button {
      background: linear-gradient(135deg, #6366f1, #4f46e5); color: #fff; padding: 16px;
      width: 100%; border-radius: 12px; font-weight: bold; border: none; margin-top: 25px;
      cursor: pointer; transition: 0.3s; font-family: 'Poppins', sans-serif; font-size: 17px;
    }
    .execute-button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(99,102,241,0.4); }
    .execute-button:disabled { background: #4b0082; cursor: not-allowed; opacity: 0.5; }
    
    .footer-action-container {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 25px;
    }
    .footer-button {
      background: rgba(99,102,241,0.15); border: 1px solid #6366f1; border-radius: 10px;
      padding: 10px 16px; font-size: 15px; color: #a5b4fc; display: flex; align-items: center; gap: 8px;
      transition: all 0.3s ease; cursor: pointer;
    }
    .footer-button:hover { background: rgba(99,102,241,0.3); }
    .footer-button a { color: #a5b4fc; text-decoration: none; }
    
    .hamburger-menu { position: absolute; top: 20px; right: 20px; z-index: 1000; cursor: pointer; }
    .hamburger-icon { width: 30px; height: 24px; display: flex; flex-direction: column; justify-content: space-between; }
    .hamburger-icon span { display: block; height: 3px; width: 100%; background-color: #a5b4fc; border-radius: 3px; transition: all 0.3s ease; }
    .hamburger-menu.active .hamburger-icon span:nth-child(1) { transform: translateY(10px) rotate(45deg); }
    .hamburger-menu.active .hamburger-icon span:nth-child(2) { opacity: 0; }
    .hamburger-menu.active .hamburger-icon span:nth-child(3) { transform: translateY(-10px) rotate(-45deg); }
    .hamburger-dropdown {
      position: absolute; top: 40px; right: 0; background: rgba(26,0,26,0.95);
      border: 2px solid #6366f1; border-radius: 12px; display: none; flex-direction: column;
      min-width: 180px; z-index: 999; overflow: hidden;
    }
    .hamburger-menu.active .hamburger-dropdown { display: flex; }
    .hamburger-item {
      padding: 12px 16px; font-size: 14px; color: #a5b4fc; cursor: pointer;
      display: flex; align-items: center; gap: 10px; text-decoration: none;
    }
    .hamburger-item:hover { background: #2a004a; color: #fff; }
    
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); z-index: 10000; justify-content: center; align-items: center;
    }
    .modal-content {
      background: rgba(26,0,26,0.95); border: 2px solid #6366f1; border-radius: 18px;
      padding: 30px; max-width: 400px; width: 90%; text-align: center;
    }
    .modal-close { background: #6366f1; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; margin-top: 15px; }
    .toast {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
      background: linear-gradient(135deg, #1a001a, #2a004a); border: 1px solid #6366f1;
      border-radius: 10px; padding: 12px 24px; color: #a5b4fc; z-index: 9999;
      transition: transform 0.3s ease;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: #22c55e; color: #22c55e; }
    .toast.error { border-color: #ef4444; color: #ef4444; }
    
    @media (max-width: 480px) { 
      .card { padding: 30px; max-width: 95%; } 
      .username { font-size: 22px; } 
      .footer-button { font-size: 13px; padding: 8px 12px; }
      .logo { width: 200px; }
      input[type="text"] { padding: 14px; }
      .dropdown-toggle { padding: 14px 16px; }
      .execute-button { padding: 14px; }
    }
    html, body { touch-action: manipulation; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="particles"></div>

  <div class="card">
    <div class="hamburger-menu" id="hamburgerMenu">
      <div class="hamburger-icon"><span></span><span></span><span></span></div>
      <div class="hamburger-dropdown">
        <a href="#" class="hamburger-item" id="manageUserItem" style="display: none;"><i class="fas fa-users-cog"></i> Manage User</a>
        <a href="index.html" class="hamburger-item"><i class="fas fa-home"></i> Home</a>
        <a href="https://t.me/rizxvelzinfinity" target="_blank" class="hamburger-item"><i class="fab fa-telegram"></i> Developer</a>
      </div>
    </div>

    <div style="text-align: center;">
      <img src="https://e.top4top.io/p_3801v3fjf1.jpg" class="logo" alt="Logo">
    </div>
    <div class="username" id="usernameDisplay">Hallo, Loading...</div>
    <div class="connected">Connected</div>

    <input type="text" id="targetNumber" placeholder="Input target host or server: 62xxx">

    <div class="dropdown" id="customDropdown">
      <div class="dropdown-toggle"><span id="selectedMode">- Select mode</span><i class="fas fa-chevron-down"></i></div>
      <div class="dropdown-menu">
        <div class="dropdown-item" data-value="iosfc">Heavy Delay</div>
        <div class="dropdown-item" data-value="androdelay2">Crash InVisible</div>
      </div>
    </div>

    <button class="execute-button" id="executeBtn" disabled><i class="fas fa-rocket"></i> Execute</button>

    <div class="footer-action-container">
      <div class="footer-button"><a href="https://t.me/rizxvelzinfinity" target="_blank"><i class="fab fa-telegram"></i> Developer</a></div>
      <div class="footer-button" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</div>
      <div class="footer-button" id="userInfoFooter"><i class="fas fa-user"></i> -- | <i class="fas fa-hourglass-half"></i> --</div>
    </div>
  </div>

  <div id="responseModal" class="modal">
    <div class="modal-content"><h3 id="modalTitle">Success</h3><p id="modalMessage"></p><button class="modal-close" onclick="closeModal()">Close</button></div>
  </div>
  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/gh/jnicol/particleground/jquery.particleground.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script>
    const COOLDOWN_SECONDS = 60;
    
    let selectedMode = null;
    let currentUser = null;
    let cooldownUntil = 0;
    let cooldownInterval = null;
    let executing = false;
    
    function showToast(msg, type = "info") {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = "toast " + (type === "success" ? "success" : type === "error" ? "error" : "");
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 4000);
    }
    
    function showModal(title, message) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalMessage').textContent = message;
      document.getElementById('responseModal').style.display = 'flex';
    }
    function closeModal() { document.getElementById('responseModal').style.display = 'none'; }
    
    function isValidNumber(num) { return /^[0-9]{10,15}$/.test(num.replace(/\D/g, "")); }
    function getRemainingCooldown() { return Math.max(0, Math.ceil((cooldownUntil - Date.now()) / 1000)); }
    
    function startCooldown() {
      cooldownUntil = Date.now() + COOLDOWN_SECONDS * 1000;
      localStorage.setItem("cooldownUntil", cooldownUntil);
      applyCooldown();
    }
    
    function applyCooldown() {
      if (cooldownInterval) clearInterval(cooldownInterval);
      const remaining = getRemainingCooldown();
      if (remaining > 0) {
        updateCooldownDisplay();
        cooldownInterval = setInterval(() => {
          if (getRemainingCooldown() <= 0) { clearInterval(cooldownInterval); updateCooldownDisplay(); } 
          else { updateCooldownDisplay(); }
        }, 1000);
      } else { updateCooldownDisplay(); }
    }
    
    function updateCooldownDisplay() {
      const remaining = getRemainingCooldown();
      const btn = document.getElementById("executeBtn");
      const targetValid = isValidNumber(document.getElementById("targetNumber").value);
      const hasMode = !!selectedMode;
      
      if (remaining > 0) {
        btn.disabled = true;
        btn.innerHTML = `<i class="fas fa-hourglass-half"></i> Cooldown: ${remaining}s`;
      } else {
        btn.disabled = !(targetValid && hasMode) || executing;
        if (!btn.disabled && !executing) btn.innerHTML = '<i class="fas fa-rocket"></i> Execute';
        else btn.innerHTML = '<i class="fas fa-rocket"></i> Execute';
      }
    }
    
    function loadCurrentUser() {
      const userStr = localStorage.getItem("currentUser");
      if (!userStr) { window.location.href = "login.html"; return null; }
      
      const user = JSON.parse(userStr);
      const users = JSON.parse(localStorage.getItem("users") || "[]");
      const fullUser = users.find(u => u.username === user.username);
      
      if (!fullUser || (fullUser.expired && Date.now() > fullUser.expired)) {
        localStorage.removeItem("currentUser");
        localStorage.removeItem("isLoggedIn");
        window.location.href = "login.html";
        return null;
      }
      
      currentUser = { username: user.username, role: user.role, expired: user.expired };
      
      document.getElementById("usernameDisplay").innerHTML = `Hallo, ${currentUser.username}`;
      document.getElementById("userInfoFooter").innerHTML = `<i class="fas fa-user"></i> ${currentUser.username} | <i class="fas fa-hourglass-half"></i> ${new Date(currentUser.expired).toLocaleDateString()}`;
      
      if (currentUser.role === "owner" || currentUser.role === "admin" || currentUser.role === "reseller") {
        document.getElementById("manageUserItem").style.display = "flex";
        document.getElementById("manageUserItem").onclick = () => window.location.href = "userlist.html";
      }
      
      return currentUser;
    }
    
    function executeAttack() {
      const target = document.getElementById("targetNumber").value.trim();
      
      if (!isValidNumber(target)) { showToast("Invalid number! Use format: 628123456789", "error"); return; }
      if (!selectedMode) { showToast("Select a mode first!", "error"); return; }
      if (getRemainingCooldown() > 0) { showToast(`Cooldown: ${getRemainingCooldown()}s`, "error"); return; }
      
      executing = true;
      const btn = document.getElementById("executeBtn");
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Processing...';
      
      setTimeout(() => {
        startCooldown();
        executing = false;
        
        const modeName = selectedMode === "iosfc" ? "Heavy Delay" : "Crash InVisible";
        
        showToast("✅ Attack executed successfully!", "success");
        showModal("✅ Success", `Time: ${new Date().toLocaleString("id-ID")}`);
        
        btn.innerHTML = '<i class="fas fa-rocket"></i> Execute';
        updateCooldownDisplay();
      }, 1500);
    }
    
    function initDropdown() {
      const dropdown = document.getElementById("customDropdown");
      const toggle = dropdown.querySelector(".dropdown-toggle");
      const menu = dropdown.querySelector(".dropdown-menu");
      const selectedText = document.getElementById("selectedMode");
      
      toggle.addEventListener("click", () => dropdown.classList.toggle("open"));
      document.addEventListener("click", (e) => { if (!dropdown.contains(e.target)) dropdown.classList.remove("open"); });
      
      menu.querySelectorAll(".dropdown-item").forEach(item => {
        item.addEventListener("click", () => {
          selectedMode = item.dataset.value;
          selectedText.textContent = item.textContent.trim();
          dropdown.classList.remove("open");
          updateCooldownDisplay();
        });
      });
    }
    
    function initHamburger() {
      const hamburger = document.getElementById("hamburgerMenu");
      hamburger.addEventListener("click", (e) => { e.stopPropagation(); hamburger.classList.toggle("active"); });
      document.addEventListener("click", (e) => { if (!hamburger.contains(e.target)) hamburger.classList.remove("active"); });
    }
    
    function logout() {
      const users = JSON.parse(localStorage.getItem("users") || "[]");
      if (currentUser) {
        const user = users.find(u => u.username === currentUser.username);
        if (user) user.isLoggedIn = false;
        localStorage.setItem("users", JSON.stringify(users));
      }
      localStorage.removeItem("currentUser");
      localStorage.removeItem("isLoggedIn");
      window.location.href = "login.html";
    }
    
    document.getElementById("targetNumber").addEventListener("input", () => updateCooldownDisplay());
    document.getElementById("executeBtn").addEventListener("click", executeAttack);
    document.getElementById("logoutBtn").addEventListener("click", logout);
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });
    
    const savedCooldown = localStorage.getItem("cooldownUntil");
    if (savedCooldown) cooldownUntil = parseInt(savedCooldown);
    
    initDropdown();
    initHamburger();
    
    if (loadCurrentUser()) {
      particleground(document.getElementById('particles'), {
        dotColor: '#a5b4fc', lineColor: '#6366f1',
        minSpeedX: 0.1, maxSpeedX: 0.3, minSpeedY: 0.1, maxSpeedY: 0.3,
        density: 10000, particleRadius: 3,
      });
      applyCooldown();
    }
  </script>
</body>
</html>
